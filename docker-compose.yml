# Uruchamiane z katalogu aplikacji na serwerze (APP_DIR w workflow).
# .env i data/ leżą obok i nie są nadpisywane przy deployu.
services:
  bot:
    build: .
    image: song50-bot:latest
    container_name: song50-bot
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATA_FILE: /data/state.json
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
